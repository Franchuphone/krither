name: Hardhat CI

on:
    push:
        branches: [main]
        paths:
            - "hardhat-env/**"
            - ".github/workflows/hardhat-ci.yml"
    pull_request:
        paths:
            - "hardhat-env/**"
            - ".github/workflows/hardhat-ci.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Smart Contract Tests (Krither)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./hardhat-env
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Use Node.js 22.x
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: pnpm
                  cache-dependency-path: hardhat-env/pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Tests
              run: pnpm hardhat test
